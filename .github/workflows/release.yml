name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag against both version fields
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG="$(jq -r .version package.json)"
          MAN="$(jq -r .version manifest.json)"
          if [ "$PKG" != "$MAN" ]; then
            echo "package.json is $PKG but manifest.json is $MAN"
            exit 1
          fi
          if [ "$TAG" != "v$PKG" ]; then
            echo "Tag $TAG does not match version $PKG"
            exit 1
          fi

      - name: Run checks and the offline smoke test
        run: npm test
      - name: Build the plugin zip
        run: npm run pack
      - name: Rename the zip with the version
        run: mv plugin.zip "plugin-${GITHUB_REF_NAME}.zip"
      - name: Record the checksum
        id: checksum
        run: echo "value=$(sha256sum "plugin-${GITHUB_REF_NAME}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "Download \`plugin-${GITHUB_REF_NAME}.zip\` from this release, then choose it in Super Productivity under Settings, Plugins, Choose Plugin File."
            echo
            echo "sha256: ${{ steps.checksum.outputs.value }}"
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "Changes since $PREVIOUS:"
              git log --no-merges --pretty=format:'- %s' "$PREVIOUS..$GITHUB_REF_NAME"
            else
              echo "Changes:"
              git log --no-merges --pretty=format:'- %s' "$GITHUB_REF_NAME"
            fi
            echo
          } > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in
            *-*) FLAGS="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "plugin-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $FLAGS
